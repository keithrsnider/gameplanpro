<div class="flex min-h-screen items-center justify-center bg-background p-4">
	<div class="w-full max-w-sm rounded-lg border bg-card p-8 shadow-sm">
		<h1 class="mb-6 text-2xl font-semibold tracking-tight">Create an Account</h1>

		<form (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-4">
			<!-- Display Name -->
			<div class="flex flex-col gap-1.5">
				<label hlmLabel for="displayName">Display name <span class="text-muted-foreground">(optional)</span></label>
				<input hlmInput id="displayName" [formField]="registrationForm.displayName" autocomplete="name" />
			</div>

			<!-- Email -->
			<div class="flex flex-col gap-1.5">
				<label hlmLabel for="email">Email</label>
				<input hlmInput id="email" type="email" [formField]="registrationForm.email" [error]="fieldHasError(registrationForm.email)" autocomplete="email" />
				<gpp-form-errors [field]="registrationForm.email" />
			</div>

			<!-- Password -->
			<div class="flex flex-col gap-1.5">
				<label hlmLabel for="password">Password</label>
				<input hlmInput id="password" type="password" [formField]="registrationForm.password" [error]="fieldHasError(registrationForm.password)" autocomplete="new-password" />
				<gpp-form-errors [field]="registrationForm.password" />
			</div>

			<!-- Confirm Password -->
			<div class="flex flex-col gap-1.5">
				<label hlmLabel for="confirmPassword">Confirm password</label>
				<input hlmInput id="confirmPassword" type="password" [formField]="registrationForm.confirmPassword" [error]="fieldHasError(registrationForm.confirmPassword)" autocomplete="new-password" />
				<gpp-form-errors [field]="registrationForm.confirmPassword" />
			</div>

			<!-- API errors -->
			@if (apiErrors.length > 0) {
				<ul class="rounded-md border border-destructive bg-destructive/10 px-4 py-3 text-sm text-destructive">
					@for (err of apiErrors; track err) {
						<li>{{ err }}</li>
					}
				</ul>
			}

			<button hlmBtn type="submit" [disabled]="registrationForm().submitting()" class="mt-2 w-full">
				{{ registrationForm().submitting() ? 'Creating account…' : 'Create account' }}
			</button>
		</form>
	</div>
</div>

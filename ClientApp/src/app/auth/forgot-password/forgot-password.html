<div class="flex min-h-screen items-center justify-center bg-background p-4">
	<div class="w-full max-w-sm rounded-lg border bg-card p-8 shadow-sm">
		<h1 class="mb-2 text-2xl font-semibold tracking-tight">Forgot password?</h1>
		<p class="mb-6 text-sm text-muted-foreground">
			Enter your email and we'll send you a link to reset your password.
		</p>

		<form (submit)="$event.preventDefault(); onSubmit()" novalidate class="flex flex-col gap-4">
			<div class="flex flex-col gap-1.5">
				<label hlmLabel for="email">Email</label>
				<input
					hlmInput
					id="email"
					type="email"
					[formField]="forgotPasswordForm.email"
					[error]="fieldHasError(forgotPasswordForm.email)"
					autocomplete="email"
				/>
				<gpp-form-errors [field]="forgotPasswordForm.email" />
			</div>

			@if (successMessage) {
				<p class="rounded-md border border-green-600/30 bg-green-600/10 px-4 py-3 text-sm text-green-700">
					{{ successMessage }}
				</p>
			}

			@if (apiErrors.length > 0) {
				<ul class="rounded-md border border-destructive bg-destructive/10 px-4 py-3 text-sm text-destructive">
					@for (err of apiErrors; track err) {
						<li>{{ err }}</li>
					}
				</ul>
			}

			<button hlmBtn type="submit" [disabled]="forgotPasswordForm().submitting()" class="mt-2 w-full">
				{{ forgotPasswordForm().submitting() ? 'Sending reset link…' : 'Send reset link' }}
			</button>
		</form>

		<p class="mt-4 text-center text-sm text-muted-foreground">
			Remembered your password?
			<a routerLink="/login" class="text-primary underline-offset-4 hover:underline">Back to sign in</a>
		</p>
	</div>
</div>

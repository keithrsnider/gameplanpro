<div class="page-container">

	<div class="page-header">
		<div>
			<h1 class="heading">Team</h1>
			<p class="subheading">Set up your team name and coaching staff.</p>
		</div>
	</div>

	@if (apiErrors.length) {
		<div class="status status--error">
			@for (error of apiErrors; track error) {
				<p>{{ error }}</p>
			}
		</div>
	}

	<form (submit)="$event.preventDefault(); onSubmit()" novalidate>
		<!-- Team Information -->
		<div class="form-card">
			<div class="form-card-content">
				<h2 class="card-heading">Team Information</h2>

				<div class="field-group">
					<label hlmLabel for="teamName">Team Name</label>
					<input
						hlmInput
						id="teamName"
						type="text"
						placeholder="e.g. Wildcats 12U"
						[formField]="teamForm.teamName"
						[error]="fieldHasError(teamForm.teamName)"
						class="w-full"
					/>
					<gpp-form-errors [field]="teamForm.teamName"/>
				</div>

				<h2 class="card-heading">Coaching Staff</h2>

				<!-- Head Coach (always present) -->
				<div class="field-group">
					<label hlmLabel for="headCoach">Head Coach</label>
					<input
						hlmInput
						id="headCoach"
						type="text"
						placeholder="e.g. Coach Smith"
						[formField]="teamForm.headCoachName"
						[error]="fieldHasError(teamForm.headCoachName)"
						class="w-full"
					/>
					<gpp-form-errors [field]="teamForm.headCoachName"/>
				</div>

				<div class="field-group">

					<label hlmLabel for="assistant-0">Assistant Coaches</label>
					<!-- Assistant Coaches -->
					@for (coach of assistantCoaches(); track $index) {
						<div class="coach-row">
							<div class="flex-1 relative">
								<input
									hlmInput
									[id]="'assistant-' + $index"
									type="text"
									placeholder="e.g. Coach Johnson"
									[value]="coach.name"
									(input)="updateAssistant($index, $any($event.target).value)"
									class="w-full pr-10"
								/>
								<button
									type="button"
									class="trash-btn"
									(click)="removeAssistant($index)"
								>
									<ng-icon hlm name="lucideTrash2" size="sm"/>
								</button>
							</div>
						</div>
					}

					<button type="button" class="add-coach-btn" (click)="addAssistant()">
						<ng-icon hlm name="lucidePlus" size="sm"/>
						<span>Add Assistant Coach</span>
					</button>
				</div>
			</div>
		</div>

		<!-- Team Roster -->
		<gpp-team-roster [players]="players()" (playersChange)="players.set($event)"/>

		<!-- Save Button -->
		<div class="button-bar">
			<div></div>
			<button type="submit" class="cta-btn" [disabled]="loading()">
				{{ hasExistingTeam ? 'Save Changes' : 'Create Team' }}
			</button>
		</div>
	</form>
</div>

<div class="flex flex-col gap-6 p-8">
	<div class="hero-card">
		<h1 class="text-white text-4xl mb-4">Create Your Next Practice Plan</h1>
		<p class="text-slate-300 text-lg mb-8">
			Build structured, time-managed practice plans for your team.
		</p>
		<button hlmBtn class="cta-btn">
			<ng-icon hlm name="lucidePlus" size="sm" />
			<span>Create Practice Plan</span>
			<ng-icon hlm name="lucideChevronRight" size="sm" />
		</button>
	</div>
	<div>
		<gpp-practice-plan-list [plans]="practicePlans" />
	</div>
</div>

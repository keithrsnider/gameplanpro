<section class="expanded-content">
	<p class="instructions-text">
		<span class="meta-label">Instructions:</span>
		{{ instructionsText() }}
	</p>

	<div class="meta-row">
		<p>
			<span class="meta-label">Number of Players:</span>
			{{ playersText() }}
		</p>
		<p>
			<span class="meta-label">Coach:</span>
			{{ coachText() }}
		</p>
	</div>

	@if (hasVideo()) {
		<a [href]="drill().demoLink" target="_blank" rel="noopener noreferrer" class="video-button">
			<span class="play-button-icon" aria-hidden="true">
				<ng-icon hlm name="lucidePlay" size="xs" />
			</span>
			<span>Video</span>
		</a>
	}
</section>

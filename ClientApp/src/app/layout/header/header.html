<header class="header">
	<div class="brand">
		<ng-icon hlm name="lucideSquareCheckBig" size="sm" class="text-gpp-orange" />
		<div>
			<span class="brand-name">GamePlanPro</span>
			<span class="brand-tagline">Save time for what matters</span>
		</div>
	</div>

	<nav class="nav">
		@for (item of navItems; track item.label) {
			@if (item.route) {
				<a
					class="nav-item"
					[routerLink]="item.route"
					routerLinkActive="nav-item--active"
				>
					<ng-icon hlm [name]="item.icon" size="sm" />
					<span>{{ item.label }}</span>
				</a>
			} @else {
				<button class="nav-item">
					<ng-icon hlm [name]="item.icon" size="sm" />
					<span>{{ item.label }}</span>
				</button>
			}
		}
	</nav>

	<button class="user-btn" (click)="signOut()">
		<ng-icon hlm name="lucideCircleUser" size="sm" />
	</button>
</header>

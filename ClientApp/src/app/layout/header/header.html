<header class="header">
	<div class="brand">
		<ng-icon hlm name="lucideSquareCheckBig" size="sm" class="text-gpp-orange" />
		<div>
			<span class="brand-name">GamePlanPro</span>
			<span class="brand-tagline">Save time for what matters</span>
		</div>
	</div>

	<nav class="nav">
		@for (item of navItems; track item.label) {
			@if (item.route) {
				<a
					class="nav-item"
					[routerLink]="item.route"
					routerLinkActive="nav-item--active"
				>
					<ng-icon hlm [name]="item.icon" size="sm" />
					<span>{{ item.label }}</span>
				</a>
			} @else {
				<button class="nav-item">
					<ng-icon hlm [name]="item.icon" size="sm" />
					<span>{{ item.label }}</span>
				</button>
			}
		}
	</nav>

	<div class="user-menu-wrap">
		<button
			type="button"
			class="user-btn"
			(click)="toggleUserMenu()"
			aria-label="Open user menu"
			aria-haspopup="menu"
			[attr.aria-expanded]="userMenuOpen()"
		>
			<ng-icon hlm name="lucideCircleUser" size="sm" />
		</button>

		@if (userMenuOpen()) {
			<div class="user-menu" role="menu" aria-label="User menu">
				<div class="user-menu__identity">
					<span class="user-menu__name">{{ currentUser()?.displayName || 'Account' }}</span>
					<span class="user-menu__email">{{ currentUser()?.email }}</span>
				</div>
				<button type="button" class="user-menu__item" (click)="goToResetPassword()" role="menuitem">
					Reset password
				</button>
				<button type="button" class="user-menu__item" (click)="signOut()" role="menuitem">
					Logout
				</button>
			</div>
		}
	</div>
</header>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 68" width="248" height="68" role="img" aria-label="GamePlanPro — Coach with confidence">
  <!--
    GamePlanPro — Primary Horizontal Logo
    Use on: website homepage, marketing collateral, email headers, landing page
    Background: white or light (#f5f7fa)
    Icon centered at y=34; text block visual center at y=34
  -->

  <!-- Icon: 54×54 centered vertically in 68px canvas → y=7 → center y=34 -->
  <svg x="0" y="7" width="54" height="54" viewBox="0 0 96 96">
    <rect width="96" height="96" rx="22" fill="#1e2a38"/>
    <path d="M16 68 L48 28 L80 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
    <path d="M24 68 L52 32 L80 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M32 68 L56 36 L80 68" fill="none" stroke="#e55a20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- Wordmark: text block spans y≈12..56, visual center ≈ 34 -->
  <!-- GAMEPLAN: cap height ~16px, baseline at y=28 -->
  <text
    x="70" y="28"
    font-family="'Outfit', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="22"
    letter-spacing="1.5"
    fill="#1e2a38">GAMEPLAN</text>

  <!-- PRO: baseline at y=43 -->
  <text
    x="71" y="43"
    font-family="'Outfit', 'Inter', system-ui, sans-serif"
    font-weight="400"
    font-size="11"
    letter-spacing="4"
    fill="#e55a20">PRO</text>

  <!-- Tagline: baseline at y=57 -->
  <text
    x="71" y="57"
    font-family="'Outfit', 'Inter', system-ui, sans-serif"
    font-weight="400"
    font-size="11"
    fill="#7d8a96">Coach with confidence</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 46" width="200" height="46" role="img" aria-label="GamePlanPro">
  <!--
    GamePlanPro — Navigation / Header Logo
    Use on: app top nav bar, browser header, tight horizontal spaces
    No tagline. Icon 38×38 to stay crisp at screen resolution.
    Icon center y=23; text block visual center y=23
  -->

  <!-- Icon: 38×38, y=4 → center y=23 -->
  <svg x="0" y="4" width="38" height="38" viewBox="0 0 96 96">
    <rect width="96" height="96" rx="22" fill="#1e2a38"/>
    <path d="M16 68 L48 28 L80 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
    <path d="M24 68 L52 32 L80 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M32 68 L56 36 L80 68" fill="none" stroke="#e55a20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- GAMEPLAN: baseline y=19 -->
  <text
    x="48" y="19"
    font-family="'Outfit', 'Inter', system-ui, sans-serif"
    font-weight="700"
    font-size="17"
    letter-spacing="1.5"
    fill="#1e2a38">GAMEPLAN</text>

  <!-- PRO: baseline y=33 -->
  <text
    x="49" y="33"
    font-family="'Outfit', 'Inter', system-ui, sans-serif"
    font-weight="400"
    font-size="10"
    letter-spacing="3.5"
    fill="#e55a20">PRO</text>
</svg>
